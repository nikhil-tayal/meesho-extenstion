<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Extension</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #3C29B7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s;
    }
    button:hover {
      background: #30228A;
    }
    button:active {
      background: #251F6B;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }
    .status.success {
      background: #4CAF50;
      color: white;
    }
    .status.error {
      background: #f44336;
      color: white;
    }
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h1>Meesho Extension</h1>
  
  <button id="fillProductSizeBtn">Fill Product, Size & Inventory</button>
  
  <div class="divider"></div>
  
  <button id="fillBtn">Fill Variations</button>
  <button id="addButtonBtn">Add Apply Button</button>
  
  <div id="status" class="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
